<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fake News Detector</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <div class="badge">
            AI POWERED • LIVE WEB VERIFICATION
        </div>

        <h1>Fake News Detector</h1>

        <p class="subtitle">
            Analyze the article you're currently reading.
        </p>

        <button id="checkNews">
            Check This Article
        </button>

        <div id="status" class="status">
            Click the button to analyze this article.
        </div>

        <div id="result" class="result"></div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
